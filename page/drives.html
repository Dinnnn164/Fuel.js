<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Водіям | Вибір пального</title>
    <link rel="stylesheet" href="/drives.css">
    <link rel="stylesheet" href="/styles.css">

</head>
<body>

    <header>
        <div class="logo">
            <img src="/photo/image.png" alt="D.Energy">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">ГОЛОВНА</a></li>
                <li><a href="/page/access.html">АДМІН</a></li>
                <li><a href="about.html">ПРО КОМПАНІЮ</a></li>
                <li><a href="contact.html">КОНТАКТИ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Вибір пального</h1>

        <div class="fuel-selection">
            <label for="fuelType">Оберіть тип пального:</label>
            <select id="fuelType"></select>
        </div>

        <div class="fuel-input">
            <label for="fuelLiters">Кількість літрів:</label>
            <input type="number" id="fuelLiters" min="1" value="1">
        </div>

        <button id="calculateBtn">Розрахувати</button>

        <div class="fuel-price">
            <p>Сума: <span id="totalPrice">0.00</span> грн</p>
            <button id="addToCartBtn">Додати до корзини</button>
        </div>

       
    </main>

    <div class="burger-menu">
        <div></div>
        <div></div>
        <div></div>
    </div>
    
    <div class="cart-container">
        <h2>Корзина</h2>
        <ul id="cartList"></ul>
        <p>Загальна сума: <span id="cartTotal">0.00</span> грн</p>
        <button id="clearCartBtn">Очистити корзину</button>
    </div>
    

    <script src="/modules/drive.js"></script>
</body>
</html>
